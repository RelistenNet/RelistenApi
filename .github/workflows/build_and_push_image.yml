name: Build and publish GHCR image

on:
  workflow_dispatch:
    inputs:
      component:
        description: Image and deployment to publish
        required: true
        default: api
        type: choice
        options:
          - api
          - user-service
          - ingestion-worker
      deploy:
        description: Restart production deployments after publishing
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write
  packages: write

env:
  REGISTRY: ghcr.io
  KEEP_GHCR_SHA_VERSIONS: "5"

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    environment: relisten3

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        env:
          COMPONENT: ${{ inputs.component }}
        run: |
          set -euo pipefail
          case "$COMPONENT" in
            api)
              image_name=relistennet/relistenapi
              dockerfile=Dockerfile
              deployments="relistenapi relistenapi-worker"
              ;;
            user-service)
              image_name=relistennet/relisten-user-service
              dockerfile=RelistenUserService/Dockerfile
              deployments=relisten-user-service
              ;;
            ingestion-worker)
              image_name=relistennet/relistenapi-ingestion-worker
              dockerfile=RelistenIngestionWorker/Dockerfile
              deployments=relistenapi-ingestion-worker
              ;;
            *)
              echo "::error::Unknown component: $COMPONENT"
              exit 1
              ;;
          esac

          short_sha="${GITHUB_SHA::12}"
          build_date="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          {
            echo "short_sha=$short_sha"
            echo "build_date=$build_date"
            echo "image=${REGISTRY}/${image_name}"
            echo "package=${image_name#relistennet/}"
            echo "dockerfile=$dockerfile"
            echo "deployments=$deployments"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ steps.meta.outputs.dockerfile }}
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.short_sha }}
            ${{ inputs.deploy && format('{0}:latest', steps.meta.outputs.image) || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.build_date }}
            org.opencontainers.image.version=sha-${{ steps.meta.outputs.short_sha }}
          build-args: |
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
            VCS_REF=${{ github.sha }}
            VERSION=sha-${{ steps.meta.outputs.short_sha }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}
          push: true

      - name: Verify GHCR package visibility
        env:
          GH_TOKEN: ${{ github.token }}
          ORG: relistennet
          PACKAGE: ${{ steps.meta.outputs.package }}
        run: |
          set -euo pipefail
          visibility="$(gh api "/orgs/$ORG/packages/container/$PACKAGE" --jq '.visibility')"
          if [ "$visibility" != "private" ]; then
            echo "::error::GHCR package $ORG/$PACKAGE visibility is '$visibility', expected 'private'"
            exit 1
          fi

      - name: Prune old GHCR image versions
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GHCR_CLEANUP_TOKEN || github.token }}
          ORG: relistennet
          PACKAGE: ${{ steps.meta.outputs.package }}
          KEEP: ${{ env.KEEP_GHCR_SHA_VERSIONS }}
        run: |
          set -euo pipefail
          ids="$(
            gh api --paginate "/orgs/$ORG/packages/container/$PACKAGE/versions?per_page=100" \
              --jq '.[] | {id, created_at, tags: (.metadata.container.tags // [])}' |
            jq -s --argjson keep "$KEEP" '
              sort_by(.created_at) | reverse
              | map(select(any(.tags[]?; startswith("sha-"))))
              | .[$keep:]
              | map(select((.tags | index("latest")) | not))
              | .[].id
            '
          )"
          if [ -z "$ids" ]; then
            echo "No old GHCR versions to prune for $ORG/$PACKAGE"
            exit 0
          fi
          while read -r id; do
            [ -z "$id" ] && continue
            echo "Deleting old GHCR package version $id for $ORG/$PACKAGE"
            gh api -X DELETE "/orgs/$ORG/packages/container/$PACKAGE/versions/$id"
          done <<< "$ids"

      - name: Connect to Tailscale
        if: ${{ inputs.deploy }}
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          ping: 100.99.27.11
          use-cache: 'true'
          tags: tag:ci
          version: latest

      - name: Set up kubectl
        if: ${{ inputs.deploy }}
        uses: azure/setup-kubectl@v5
        with:
          version: v1.36.2

      - name: Configure relisten3 kubeconfig
        if: ${{ inputs.deploy }}
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl config use-context relisten3-k3s

      - name: Restart relisten3 deployments
        if: ${{ inputs.deploy }}
        env:
          DEPLOYMENTS: ${{ steps.meta.outputs.deployments }}
        run: |
          set -euo pipefail
          for deployment in $DEPLOYMENTS; do
            if kubectl -n default get "deployment/$deployment" >/dev/null 2>&1; then
              kubectl -n default rollout restart "deployment/$deployment"
            else
              echo "Deployment $deployment does not exist yet; image publication is complete."
            fi
          done
          for deployment in $DEPLOYMENTS; do
            if kubectl -n default get "deployment/$deployment" >/dev/null 2>&1; then
              kubectl -n default rollout status "deployment/$deployment" --timeout=10m
            fi
          done
