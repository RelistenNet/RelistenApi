name: API tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: catalog_test
          POSTGRES_DB: relisten_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d relisten_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RELISTEN_TEST_DATABASE_URL: postgresql://postgres:catalog_test@127.0.0.1:5432/relisten_test
      RELISTEN_TOUR_TEST_DATABASE_URL: postgresql://postgres:catalog_test@127.0.0.1:5432/relisten_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet test RelistenApiTests/RelistenApiTests.csproj --configuration Release
