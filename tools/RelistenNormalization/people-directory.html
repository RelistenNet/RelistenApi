<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>Tapers and transferrers · Relisten</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      background: #101b1b;
      color: #e9eeeb;
    }
    body {
      max-width: 1050px;
      margin: auto;
      padding: 24px;
    }
    h1 {
      font-size: clamp(2rem, 6vw, 3.2rem);
      margin: 10px 0;
    }
    h2 {
      margin-top: 30px;
    }
    a {
      color: #9ddfd0;
    }
    p {
      line-height: 1.55;
    }
    small,
    .muted {
      color: #a8bdb7;
    }
    input,
    select,
    button {
      font: inherit;
      padding: 11px;
      border: 1px solid #4a6660;
      border-radius: 8px;
      background: #1a2b28;
      color: inherit;
      max-width: 100%;
      box-sizing: border-box;
    }
    input {
      flex: 1;
      min-width: 100px;
    }
    button,
    a {
      cursor: pointer;
    }
    form,
    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 18px 0;
    }
    .card {
      background: #1b2b28;
      border: 1px solid #38554c;
      border-radius: 12px;
      padding: 18px;
      margin: 13px 0;
      overflow-wrap: anywhere;
    }
    .card h3 {
      margin: 0 0 9px;
    }
    .badge {
      font-size: 0.8rem;
      color: #e4cf95;
    }
    blockquote {
      margin: 10px 0;
      border-left: 2px solid #678f80;
      padding: 8px 14px;
      white-space: pre-wrap;
    }
    details {
      margin: 12px 0;
    }
    summary {
      cursor: pointer;
    }
    .counts {
      font-size: 0.9rem;
      color: #c3d4ca;
    }
    .error {
      color: #ffb2a5;
    }
    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .filters label {
      display: grid;
      gap: 6px;
      flex: 1 1 220px;
      min-width: 0;
    }
    .filters select {
      width: 100%;
    }
    .person-name {
      font-size: 1.2rem;
      font-weight: 650;
    }
    #status {
      min-height: 25px;
    }
    nav {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }
    li {
      line-height: 1.5;
      margin: 8px 0;
    }
    code {
      overflow-wrap: anywhere;
    }
    @media (max-width: 500px) {
      body {
        padding: 18px 14px;
      }
      .card {
        padding: 14px;
      }
    }
  </style>
  <nav aria-label="Music discovery">
    <a data-navigation="songs" hidden>Songs</a>
    <a data-navigation="compositions" hidden>Compositions</a>
    <a data-navigation="venues" hidden>Venues</a>
    <a data-navigation="tapers" href="/">Tapers</a>
  </nav>
  <p class="badge">RECORDING CREDITS</p>
  <h1 id="directory-title">Tapers and transferrers</h1>
  <p id="directory-intro">Search tapers and transferrers by name or alias.</p>
  <form id="search">
    <input
      id="query"
      aria-label="Search source name or explicit alias"
      placeholder="Aadam Jacobs, Charlie Miller, Rob Berger…"
    /><button>Search</button>
  </form>
  <details>
    <summary>Coverage and how the directory works</summary>
    <p id="coverage" class="counts"></p>
    <p><a href="?context=1">Contextual comparisons</a> · <a id="files-link" href="#">Source files</a> · <a id="core-link" href="#">All source evidence</a></p>
    <ul id="issues"></ul>
  </details>
  <div id="status" aria-live="polite"></div>
  <main id="results"></main>
  <div id="pagination" class="controls"></div>
  <script>
    const $ = (id) => document.getElementById(id),
      count = (n) => Number(n).toLocaleString(),
      quantity = (n, singular, plural = singular + "s") =>
        count(n) + " " + (Number(n) === 1 ? singular : plural);
    let sourceActorsSupported = false;
    let pageRequest = null;
    function node(tag, text, cls) {
      let n = document.createElement(tag);
      if (text !== undefined) n.textContent = text;
      if (cls) n.className = cls;
      return n;
    }
    function link(label, url) {
      let a = node("a", label);
      a.href = url;
      return a;
    }
    function pageButton(label, action) {
      let b = node("button", label);
      b.onclick = action;
      return b;
    }
    function setLocation(params) {
      history.pushState(null, "", "?" + new URLSearchParams(params));
      load();
    }
    async function get(url) {
      let r = await fetch(url, { signal: pageRequest?.signal });
      if (!r.ok) throw Error("Request failed (" + r.status + ").");
      return r.json();
    }
    function pages(total, offset, limit, params, options = {}) {
      const container = options.container || $("pagination");
      const offsetKey = options.offsetKey || "offset";
      container.replaceChildren();
      if (offset > 0) {
        container.append(
          pageButton("Previous", () =>
            setLocation({
              ...params,
              [offsetKey]: Math.max(0, offset - limit),
            }),
          ),
        );
      }
      if (offset + limit < total) {
        container.append(
          pageButton("Next", () =>
            setLocation({ ...params, [offsetKey]: offset + limit }),
          ),
        );
      }
    }
    async function load() {
      pageRequest?.abort();
      const request = new AbortController();
      pageRequest = request;
      let p = Object.fromEntries(new URLSearchParams(location.search));
      $("directory-title").hidden = !!p.person;
      $("directory-intro").hidden = !!p.person;
      $("query").value = p.q || "";
      $("results").replaceChildren();
      $("pagination").replaceChildren();
      $("status").textContent = "Loading…";
      $("status").className = "";
      try {
        if (p.context) {
          $("status").textContent = "";
          await relationships("", Number(p.offset || 0));
        } else if (p.person) await sharedPerson(p);
        else if (p.id) await detail(p);
        else await search(p);
      } catch (e) {
        if (request.signal.aborted) return;
        $("status").textContent = e.message;
        $("status").className = "error";
      }
    }
    function personCard(person) {
      const card = node("article", undefined, "card");
      card.append(
        node("p", "PROVISIONAL PERSON", "badge"),
        link(
          person.displayName,
          "?" + new URLSearchParams({ person: person.id }),
        ),
        node(
          "p",
          quantity(person.recordingCount, "supported recording") +
            " across " +
            quantity(person.artistCount, "artist") +
            " · " +
            quantity(person.creditCount, "credit mention"),
          "counts",
        ),
      );
      card.querySelector("a").className = "person-name";
      const names = [...new Set([...person.names, ...person.aliases])];
      if (names.length)
        card.append(
          node("p", "Credited names and aliases: " + names.join(" · ")),
        );
      return card;
    }

    async function search(p) {
      const data = await get("/api/people?" + new URLSearchParams(p));
      const supported = Array.isArray(data.personHypotheses);
      $("status").textContent = supported
        ? quantity(
            data.personHypothesesTotal,
            "provisional person",
            "provisional people",
          ) +
          (p.q ? " matching “" + p.q + "”" : "") +
          "."
        : count(data.total) +
          " raw name groups" +
          (p.q ? " matching “" + p.q + "”" : "") +
          ".";
      if (supported) {
        const section = node("section");
        section.append(node("h2", "Person profiles"));
        for (const person of data.personHypotheses)
          section.append(personCard(person));
        if (!data.personHypotheses.length)
          section.append(
            node(
              "p",
              "No supported person profile matches. Browse the original name groups below.",
            ),
          );
        const controls = node("div", undefined, "controls");
        pages(
          data.personHypothesesTotal,
          data.personHypothesesOffset,
          data.personHypothesesLimit,
          p,
          { container: controls, offsetKey: "personOffset" },
        );
        section.append(controls);
        $("results").append(section);
      }
      const raw = node(supported ? "details" : "section");
      if (supported) {
        raw.open = !!p.raw || !data.personHypotheses.length;
        raw.append(
          node("summary", "Raw name groups (" + count(data.total) + ")"),
        );
      } else raw.append(node("h2", "Raw name groups"));
      raw.append(
        node(
          "p",
          "Browse original recording credits and role-free alias observations. A raw name group can include namesakes.",
        ),
      );
      for (const group of data.groups) {
        const card = node("article", undefined, "card");
        card.append(
          link(group.display_name, "?" + new URLSearchParams({ id: group.id })),
          node(
            "p",
            count(group.recording_count) +
              " catalog recordings · " +
              count(group.artist_count) +
              " catalog artists · " +
              count(group.credit_count) +
              " catalog credit mentions" +
              (group.native_actor_count
                ? " · " +
                  count(group.native_actor_count) +
                  " native actor observations · " +
                  count(group.native_credit_count) +
                  " native role mentions"
                : "") +
              (sourceActorsSupported && group.source_actor_count
                ? " · " +
                  count(group.source_actor_count) +
                  " source alias observations across " +
                  count(group.source_recording_count) +
                  " recordings and " +
                  count(group.source_artist_count) +
                  " artists"
                : ""),
            "counts",
          ),
        );
        raw.append(card);
      }
      const controls = node("div", undefined, "controls");
      pages(data.total, data.offset, data.limit, p, { container: controls });
      raw.append(controls);
      $("results").append(raw);
    }

    function comparisonWitnesses(comparison) {
      const details = node("details");
      const body = node("div");
      let loaded = false,
        loading = false;
      details.append(
        node("summary", "Inspect exact witnesses and playable recordings"),
        body,
      );
      details.ontoggle = async () => {
        if (!details.open || loaded || loading) return;
        loading = true;
        body.replaceChildren(node("p", "Loading source evidence…"));
        try {
          const detail = await get(
            comparison.evidenceUrl ||
              "/api/relationship?" + new URLSearchParams({ id: comparison.id }),
          );
          body.replaceChildren();
          if (detail.support) {
            body.append(
              node("pre", JSON.stringify(detail.support.features, null, 2)),
            );
            for (const item of detail.buckets) {
              const actor = item.representative;
              body.append(node("h3", actor?.name || item.bucket.bucketId));
              if (actor?.sourceEvidenceUrl)
                body.append(
                  link("Original source evidence", actor.sourceEvidenceUrl),
                );
              if (actor?.playableFilesUrl)
                body.append(
                  link(
                    "Open this recording’s playable files",
                    actor.playableFilesUrl,
                  ),
                );
              for (const evidence of item.bucket.evidence) {
                body.append(
                  node("blockquote", evidence.quote),
                  node(
                    "p",
                    evidence.jsonPointer +
                      " · code points " +
                      evidence.startCodePoint +
                      "–" +
                      evidence.endCodePoint,
                    "muted",
                  ),
                );
              }
              body.append(node("details"));
              const original = body.lastChild;
              original.append(
                node("summary", "Original bucket and source coordinates"),
                node("pre", JSON.stringify(item, null, 2)),
              );
            }
            loaded = true;
            return;
          }
          for (const side of ["left", "right"]) {
            const actor = detail.question[side];
            body.append(
              node("h3", actor.name + " · " + actor.artistName),
              node(
                "p",
                [
                  actor.literalDate || "Date unavailable",
                  actor.roles.join(", "),
                ].join(" · "),
              ),
              link(
                "Open this recording’s playable files",
                actor.playableFilesUrl,
              ),
              document.createTextNode(" · "),
              link("Original source evidence", actor.sourceEvidenceUrl),
            );
            for (const excerpt of actor.evidence) {
              body.append(
                node(
                  "p",
                  excerpt.field +
                    " · code points " +
                    excerpt.startCodePoint +
                    "–" +
                    excerpt.endCodePoint,
                  "muted",
                ),
                node("blockquote", excerpt.quote),
              );
            }
            if (actor.actorFacts)
              body.append(
                node("pre", JSON.stringify(actor.actorFacts, null, 2)),
              );
          }
          loaded = true;
        } catch (error) {
          body.replaceChildren(
            node("p", error.message + " Close and reopen to retry.", "error"),
          );
        } finally {
          loading = false;
        }
      };
      return details;
    }

    function comparisonSection(title, comparisons) {
      const section = node("details");
      section.append(
        node("summary", title + " (" + count(comparisons.length) + ")"),
      );
      let loaded = false;
      section.ontoggle = () => {
        if (!section.open || loaded) return;
        loaded = true;
        for (const comparison of comparisons) {
          const card = node("article", undefined, "card");
          card.append(
            node("h3", comparison.leftName + " ↔ " + comparison.rightName),
            node("p", comparison.reason),
          );
          for (const evidence of comparison.evidence) {
            card.append(
              node("p", evidence.side + " · " + evidence.field, "muted"),
              node("blockquote", evidence.quote),
            );
          }
          card.append(comparisonWitnesses(comparison));
          section.append(card);
        }
      };
      return section;
    }

    function recordingFilters(person, parameters) {
      const controls = node("div", undefined, "controls filters");
      for (const filter of [
        {
          key: "artist",
          label: "Artist",
          all: "All artists",
          items: person.artists,
          value: (item) => item.uuid,
          name: (item) => item.name,
        },
        {
          key: "role",
          label: "Recording role",
          all: "All recording roles",
          items: person.roles,
          value: (item) => item.role,
          name: (item) => roleLabel(item.role),
        },
      ]) {
        const label = node("label", filter.label);
        const select = node("select");
        select.setAttribute(
          "aria-label",
          "Filter supported recordings by " + filter.label.toLowerCase(),
        );
        const all = node("option", filter.all);
        all.value = "";
        select.append(all);
        for (const item of filter.items) {
          const option = node(
            "option",
            filter.name(item) +
              " (" +
              quantity(item.recordingCount, "recording") +
              ")",
          );
          option.value = filter.value(item);
          select.append(option);
        }
        select.value = parameters[filter.key] || "";
        select.onchange = () =>
          setLocation({ ...parameters, [filter.key]: select.value, offset: 0 });
        label.append(select);
        controls.append(label);
      }
      return controls;
    }

    async function sharedPerson(p) {
      const { person: identifier, ...filters } = p;
      const person = await get(
        "/api/shared-person?" +
          new URLSearchParams({ ...filters, id: identifier }),
      );
      $("status").textContent = "";
      const header = node("section");
      header.append(
        link("← Search people", "?"),
        node("p", "PROVISIONAL PERSON", "badge"),
        node("h1", person.displayName),
        node(
          "p",
          quantity(person.recordingCount, "supported recording") +
            " across " +
            quantity(person.artistCount, "artist") +
            " · " +
            quantity(person.creditCount, "credit mention"),
          "counts",
        ),
      );
      const names = [...new Set([...person.names, ...person.aliases])];
      if (names.length)
        header.append(
          node("p", "Credited names and aliases: " + names.join(" · ")),
        );
      header.append(
        link(
          "Raw name observations",
          "?" + new URLSearchParams({ q: person.displayName, raw: 1 }),
        ),
      );
      header.append(
        recordingFilters(person, p),
        node(
          "p",
          quantity(person.total, "supported recording") +
            (person.total === 1 ? " matches" : " match") +
            " these filters.",
          "counts",
        ),
      );
      const grouping = node("details");
      grouping.append(
        node("summary", "How recordings are grouped"),
        node("p", person.membershipRule),
        node("p", "Several roles on the same recording count once."),
        comparisonSection("Supporting comparisons", person.support),
      );
      if (person.unmappedOccurrenceCount || person.unmappedCreditCount)
        grouping.append(node("p", "Some supported source mentions could not be linked to recordings in this directory: " +
          count(person.unmappedOccurrenceCount || 0) + " whole actor observations and " +
          count(person.unmappedCreditCount || 0) + " credit occurrences."));
      if (person.conflicts.length)
        grouping.append(
          comparisonSection("Conflicting comparisons", person.conflicts),
        );
      if (person.insufficientEvidence.length)
        grouping.append(
          comparisonSection(
            "Comparisons without enough evidence",
            person.insufficientEvidence,
          ),
        );
      if (person.relatedSupport?.length)
        grouping.append(
          comparisonSection(
            "Other supported comparisons",
            person.relatedSupport,
          ),
        );
      if (person.overlappingHypotheses?.length) {
        const alternatives = node("details");
        const list = node("ul");
        alternatives.append(
          node(
            "summary",
            "Alternative person profiles (" +
              count(person.overlappingHypotheses.length) +
              ")",
          ),
        );
        for (const alternative of person.overlappingHypotheses) {
          const item = node("li");
          item.append(
            link(
              alternative.displayName,
              "?" + new URLSearchParams({ person: alternative.id }),
            ),
            document.createTextNode(
              " · " +
                quantity(alternative.recordingCount, "supported recording") +
                " across " +
                quantity(alternative.artistCount, "artist"),
            ),
          );
          list.append(item);
        }
        alternatives.append(list);
        grouping.append(alternatives);
      }
      $("results").append(header);
      if (!person.recordings.length)
        $("results").append(
          node("p", "No supported recording credits match these filters."),
        );
      for (const recording of person.recordings)
        $("results").append(recordingCard(recording));
      $("results").append(grouping);
      pages(person.total, person.offset, person.limit, p);
    }

    function roleLabel(role) {
      return (
        {
          taper: "Taper",
          transferrer: "Transferrer",
          mastering_engineer: "Mastering engineer",
          other: "Other",
        }[role] || role.replaceAll("_", " ")
      );
    }
    async function relationships(group, offset = 0, previous = null) {
      let data = await get(
        "/api/relationships?" +
          new URLSearchParams({ group, offset, limit: 10 }),
      );
      if (!data.total) {
        if (!group)
          $("status").textContent =
            "Contextual results have not been attached yet.";
        return;
      }
      let section = node("section");
      section.append(
        node("h2", "Contextual identity proposals"),
        node(
          "p",
          count(data.total) +
            " comparisons" +
            (group
              ? " involving this name group"
              : " across the selected development population") +
            ". Luna used captured credits and surrounding prose. These proposals do not merge people or recordings; a name group can contain namesakes.",
        ),
      );
      for (let r of data.relationships) {
        let card = node("article", undefined, "card");
        card.append(
          node("h3", r.left_name + " ↔ " + r.right_name),
          node(
            "p",
            {
              same_person: "Possible same person",
              different_people: "Possible different people",
              insufficient_evidence: "Insufficient evidence",
            }[r.relation],
            "badge",
          ),
          node("p", r.reason),
          ...(r.basis === "recovered_from_failed_batch"
            ? [
                node(
                  "p",
                  "Recovered valid decision from a response with other rejected quotations",
                  "badge",
                ),
              ]
            : []),
        );
        for (let e of r.evidence)
          card.append(
            node("p", e.side + " · " + e.field, "muted"),
            node("blockquote", e.quote),
          );
        let actions = node("p");
        for (let [label, id] of [
          [r.left_name, r.left_group],
          [r.right_name, r.right_group],
        ]) {
          actions.append(
            link(label + " recordings", "?" + new URLSearchParams({ id })),
            document.createTextNode(" · "),
          );
        }
        card.append(actions);
        card.append(comparisonWitnesses(r));
        section.append(card);
      }
      let controls = node("div", undefined, "controls");
      for (let [label, start] of [
        ["Previous comparisons", offset - 10],
        ["More comparisons", offset + 10],
      ]) {
        if (start >= 0 && start < data.total)
          controls.append(
            pageButton(label, () => relationships(group, start, section)),
          );
      }
      section.append(controls);
      if (previous) previous.replaceWith(section);
      else $("results").append(section);
    }
    function nativeObservations(data, parameters) {
      if (!data.nativeTotal && !data.nativeArtists?.length) return;
      const section = node("section");
      section.append(node("h2", "Native provider observations"), node("p",
        "These original actor accounts are separate from catalog credit counts and contextual comparisons. A native observation may repeat a catalog credit; the counts are not additive. Native capture UUIDs do not establish a production home or a shared person identity."));
      const select = node("select");
      select.setAttribute("aria-label", "Filter native observations by artist context");
      const all = node("option", "All native artist contexts");
      all.value = "";
      select.append(all);
      for (const artist of data.nativeArtists) {
        const option = node("option", artist.artist_name + " (" + count(artist.observations) + " observations)");
        option.value = artist.artist_key;
        select.append(option);
      }
      select.value = parameters.nativeArtist || "";
      select.onchange = () => setLocation({...parameters, nativeArtist: select.value, nativeOffset: 0});
      section.append(select, node("p", count(data.nativeTotal) + " original actor observations in this view", "counts"));
      for (const actor of data.nativeObservations) {
        const card = node("article", undefined, "card");
        const scope = actor.file_origin ? "Original file account"
          : actor.input_revision_uuid !== actor.input_uuid ? "Selected supporting root account" : "Original recording account";
        card.append(node("h3", actor.name + " · " + actor.artist_name),
          node("p", actor.provider + " · " + scope),
          node("p", actor.role_free ? "Role-free alias assertion · no recording credit role"
            : "Native credit proposals: " + actor.credits.map(credit => credit.role).join(", ")));
        if (actor.aliases.length) card.append(node("p", "Explicit source aliases: " + actor.aliases.join(" · ")));
        for (const evidence of actor.evidence) {
          if (evidence.quote) card.append(node("blockquote", evidence.quote));
        }
        const original = node("details");
        original.append(node("summary", "Original native scope and citations"), node("pre", JSON.stringify({
          inputKey: actor.input_key, inputRevisionUuid: actor.input_revision_uuid,
          recordingOrigin: actor.recording_origin, fileOrigin: actor.file_origin,
          catalogSourceUuidInNativeCapture: actor.catalog_source_uuid,
          catalogShowUuidInNativeCapture: actor.catalog_show_uuid,
          bindingReason: actor.binding_reason, originRun: actor.originRun,
          catalogNamespace: actor.catalogNamespace, evidence: actor.evidence,
        }, null, 2)));
        card.append(link("Inspect original actor evidence", actor.sourceEvidenceUrl), document.createTextNode(" · "),
          link("Browse this input's files", actor.inputFilesUrl), original);
        section.append(card);
      }
      const controls = node("div", undefined, "controls");
      if (data.nativeOffset) controls.append(pageButton("Previous native observations", () =>
        setLocation({...parameters, nativeOffset: Math.max(0, data.nativeOffset - data.nativeLimit)})));
      if (data.nativeOffset + data.nativeLimit < data.nativeTotal) controls.append(pageButton("Next native observations", () =>
        setLocation({...parameters, nativeOffset: data.nativeOffset + data.nativeLimit})));
      section.append(controls);
      $("results").append(section);
    }

    function performanceLabel(home) {
      return [
        home?.literalDate || "Date unavailable",
        home?.performanceLabel ||
          (home?.performanceType !== "unknown" ? home?.performanceType : null),
      ].filter(Boolean).join(" · ");
    }

    function sourceObservations(data, parameters) {
      // Older directory generations do not expose this population or its evidence route.
      if (!sourceActorsSupported || !Array.isArray(data.sourceObservations) ||
          (!data.sourceTotal && !data.sourceArtists?.length)) return;
      const section = node("section");
      section.append(
        node("h2", "Source alias observations"),
        node("p", "These explicit alias statements come from captured catalog recording fields. They do not assert a recording credit role, person kind or accepted identity. An observation can repeat a catalog credit or native account, so these counts are not additive. Matching names bring observations together; they do not establish that the observations describe the same person."),
      );
      const select = node("select");
      select.setAttribute("aria-label", "Filter source alias observations by artist");
      const all = node("option", "All source artists");
      all.value = "";
      select.append(all);
      for (const artist of data.sourceArtists || []) {
        const option = node("option", artist.name + " (" + count(artist.observations) + " observations)");
        option.value = artist.uuid;
        select.append(option);
      }
      select.value = parameters.sourceArtist || "";
      select.onchange = () => setLocation({ ...parameters, sourceArtist: select.value, sourceOffset: 0 });
      section.append(select, node("p", count(data.sourceTotal) + " source alias observations in this view", "counts"));
      for (const actor of data.sourceObservations) {
        const card = node("article", undefined, "card");
        card.append(
          node("p", "SOURCE · ROLE-FREE ALIAS OBSERVATION", "badge"),
          node("h3", actor.name + " · " + (actor.artist_name || actor.artist_uuid || "Unknown artist")),
          node("p", "Captured assignment: " + performanceLabel(actor.capturedHome)),
          node("p", "Source " + actor.source_uuid, "muted"),
        );
        for (const alias of actor.aliases) {
          card.append(node("p", "Explicit source alias: " + alias.wording));
          for (const evidence of alias.evidence || []) {
            if (evidence.quote) card.append(node("blockquote", evidence.quote));
          }
        }
        const original = node("details");
        const facts = node("pre", JSON.stringify({
          sourceUuid: actor.source_uuid,
          artistUuid: actor.artist_uuid,
          personKey: actor.person_key,
          actorReference: actor.actor_reference,
          originRun: actor.originRun,
          aliases: actor.aliases,
        }, null, 2));
        facts.style.whiteSpace = "pre-wrap";
        original.append(node("summary", "Original source scope and alias citations"), facts);
        card.append(
          link("Inspect original source alias evidence", actor.sourceEvidenceUrl),
          document.createTextNode(" · "),
          link("Open this recording’s playable files", actor.playableFilesUrl),
          original,
        );
        section.append(card);
      }
      const controls = node("div", undefined, "controls");
      if (data.sourceOffset) controls.append(pageButton("Previous source observations", () =>
        setLocation({ ...parameters, sourceOffset: Math.max(0, data.sourceOffset - data.sourceLimit) })));
      if (data.sourceOffset + data.sourceLimit < data.sourceTotal) controls.append(pageButton("Next source observations", () =>
        setLocation({ ...parameters, sourceOffset: data.sourceOffset + data.sourceLimit })));
      section.append(controls);
      $("results").append(section);
    }

    async function detail(p) {
      const request = pageRequest;
      let d = await get("/api/person?" + new URLSearchParams(p));
      $("status").textContent = "";
      let header = node("section");
      header.append(
        link("← All name groups", "?"),
        node("h2", d.display_name),
        node(
          "p",
          count(d.recording_count) +
            " catalog recordings across " +
            count(d.artist_count) +
            " catalog artists. Shared wording retrieves observations; this name group may contain different people.",
        ),
      );
      header.append(
        node(
          "p",
          "Catalog credit roles: " +
            (d.roles
              .map(
                (r) =>
                  r.role + " (" + count(r.recording_count) + " recordings)",
              )
              .join(", ") || "none"),
          "counts",
        ),
      );
      let spellings = [
        ...new Set(
          d.names.map(
            (n) =>
              n.wording +
              (n.basis === "explicit_source_alias" ? " [explicit alias]" : ""),
          ),
        ),
      ];
      header.append(
        node(
          "p",
          "Source names and explicit aliases: " + spellings.join(" · "),
          "counts",
        ),
      );
      if (d.relatedGroups.length) {
        let related = node(
          "p",
          "Related name groups from explicit alias overlap: ",
        );
        for (let g of d.relatedGroups)
          related.append(
            link(g.display_name, "?" + new URLSearchParams({ id: g.id })),
            document.createTextNode(" · "),
          );
        header.append(related);
      }
      let controls = node("div", undefined, "controls"),
        select = node("select");
      select.setAttribute("aria-label", "Filter recordings by artist");
      let option = node("option", "All artists");
      option.value = "";
      select.append(option);
      for (let a of d.artists) {
        let o = node("option", a.name + " (" + count(a.recording_count) + ")");
        o.value = a.uuid;
        select.append(o);
      }
      select.value = p.artist || "";
      select.onchange = () =>
        setLocation({
          ...p,
          artist: select.value,
          offset: 0,
        });
      controls.append(select);
      header.append(
        controls,
        node(
          "p",
          count(d.total) +
            " recordings in this view. Each recording has one source UUID; multiple roles count once.",
          "counts",
        ),
      );
      if (Array.isArray(d.personHypotheses) && d.personHypotheses.length) {
        const shared = node("section");
        shared.append(
          node("h3", "Supported person pages for credits in this name group"),
        );
        for (const person of d.personHypotheses)
          shared.append(personCard(person));
        header.append(shared);
      }
      $("results").append(header);
      await relationships(p.id);
      if (request !== pageRequest || request.signal.aborted) return;
      nativeObservations(d, p);
      sourceObservations(d, p);
      for (const recording of d.recordings)
        $("results").append(recordingCard(recording));
      pages(d.total, d.offset, d.limit, p);
    }
    function recordingCard(r) {
      let card = node("article", undefined, "card"),
        names = [
          ...new Set(
            [...r.credits, ...(r.sourceObservations || [])].map(
              (c) => c.artist_name || c.artist_uuid || "Unknown artist",
            ),
          ),
        ];
      card.append(
        node("h3", names.join(" · ")),
        node("p", performanceLabel(r.capturedHome)),
      );
      if (window.recordingTracks) card.append(window.recordingTracks(r.sourceUuid));
      card.append(link(window.recordingTracks ? "Original source evidence ↗" : "Open playable files →", r.playableFilesUrl));
      const assignment = node("details");
      assignment.append(
        node("summary", "Recording source and captured show"),
        node("p", "Source " + r.sourceUuid, "muted"),
      );
      if (r.capturedHome) {
        const home = r.capturedHome;
        assignment.append(
          node("p", "Show " + (home.showUuid || "unavailable"), "muted"),
        );
        for (const issue of home.unresolved) {
          assignment.append(
            node(
              "p",
              typeof issue === "string" ? issue : JSON.stringify(issue),
            ),
          );
        }
      }
      card.append(assignment);
      for (let c of r.credits) {
        let section = node("details"),
          summary = node(
            "summary",
            c.name +
              " · " +
              roleLabel(c.role) +
              " · " +
              (c.interpretation_basis === "retained_luna_extraction"
                ? "Luna proposal"
                : "Local parser"),
          );
        section.append(summary);
        if (c.evidence)
          section.append(
            node("blockquote", c.evidence.quote),
            node(
              "p",
              "Source field: " +
                c.evidence.field +
                " · code points " +
                c.evidence.startCodePoint +
                "–" +
                c.evidence.endCodePoint,
              "counts",
            ),
          );
        for (let a of c.aliases)
          section.append(
            node("p", "Explicit alias: " + a.wording),
            node(
              "blockquote",
              (a.evidence || []).map((e) => e.quote).join("\n"),
            ),
          );
        section.append(link("Inspect source extraction", c.sourceEvidenceUrl));
        card.append(section);
      }
      for (const actor of r.sourceObservations || []) {
        const section = node("details");
        section.append(
          node("summary", actor.name + " · Source alias observation"),
        );
        for (const alias of actor.aliases) {
          section.append(node("p", "Explicit alias: " + alias.wording));
          for (const evidence of alias.evidence || [])
            section.append(node("blockquote", evidence.quote));
        }
        section.append(
          link("Inspect original source alias", actor.sourceEvidenceUrl),
        );
        card.append(section);
      }
      return card;
    }

    $("search").onsubmit = (e) => {
      e.preventDefault();
      setLocation({ q: $("query").value });
    };
    window.onpopstate = load;
    get("/api/stats")
      .then(async (s) => {
        for (const anchor of document.querySelectorAll("[data-navigation]")) {
          const target = s.navigation?.[anchor.dataset.navigation];
          if (target) { anchor.href = target; anchor.hidden = false; }
        }
        if (s.capabilities?.recordingPlayback) {
          await new Promise((resolve) => {
            const script = document.createElement("script");
            script.src = "/recording-playback.js";
            script.onload = script.onerror = resolve;
            document.head.append(script);
          });
        }
        sourceActorsSupported = s.capabilities?.sourceActors === true;
        $("files-link").href = s.filesUrl;
        $("core-link").href = s.coreUrl;
        $("coverage").textContent =
          count(s.sourceRows) +
          " source recordings scanned · " +
          count(s.creditedRecordings) +
          " with extracted credits · " +
          count(s.creditedArtists) +
          " artists with credits · " +
          count(s.groups) +
          " draft name groups" +
          (s.modelCreditMentions
            ? " · " +
              count(s.modelCreditMentions) +
              " retained Luna credit proposals"
            : "");
        if (s.nativeDirectory) {
          const native = s.nativeDirectory;
          $("coverage").append(node("span", " · native overlay: " + count(native.actors) + " actor observations, "
            + count(native.creditMentions) + " role mentions and " + count(native.aliasActors) + " role-free alias actors (separate counts)"));
        }
        if (sourceActorsSupported) {
          $("coverage").append(node("span", " · source aliases: " + count(s.sourceActors) + " role-free observations across "
            + count(s.sourceActorRecordings) + " recordings and " + count(s.sourceActorArtists) + " artists (separate counts)"));
        }
        if (s.peopleContext) {
          let context = s.peopleContext;
          $("coverage").append(
            document.createTextNode(
              " · " +
                count(context.decisions) +
                " contextual comparison results from " +
                count(context.processedQuestions) +
                " processed questions" +
                (context.plannedQuestions
                  ? " of " + count(context.plannedQuestions) + " selected"
                  : "") +
                ((context.executionState || context.state) === "snapshot"
                  ? " (run continuing)"
                  : (context.executionState || context.state) === "cancelled"
                    ? " (run stopped; remaining selected questions were not processed)"
                    : "") +
                (context.rejectedQuestions
                  ? " · " +
                    count(context.rejectedQuestions) +
                    " questions have no supported retained decision"
                  : "") +
                (context.invalidatedByCreditReplacement
                  ? " · " + count(context.invalidatedByCreditReplacement) +
                    " earlier comparisons are excluded from this generation because their credit evidence changed"
                  : ""),
            ),
          );
        }
        for (let issue of s.knownIssues) $("issues").append(node("li", issue));
      })
      .catch((e) => ($("coverage").textContent = e.message))
      .finally(load);
  </script>
</html>
