query SongHistoryPlayback($song: ID!, $first: Int! = 25, $after: String) {
  song(id: $song) {
    id
    name
    matchedShowCount
    matchedTrackCount
    artist {
      id
      name
    }
    shows(first: $first, after: $after, orderBy: DATE_DESCENDING) {
      nodes {
        show {
          id
          displayDate
          sourceCount
          popularity {
            windows {
              days30 {
                plays
              }
            }
          }
          artistVenue {
            venue {
              id
              name
              city
              region
            }
          }
          importedVenue {
            name
            location
          }
        }
        timings {
          singleSong {
            median
            sourceCount
          }
          multiSong {
            median
            sourceCount
          }
        }
        tracks(first: 20, selection: TOP) {
          nodes {
            id
            title
            duration
            trackPosition
            mp3Url
            flacUrl
            source {
              id
              isSoundboard
              avgRating
              taper
            }
            normalization {
              state
              parts {
                ordinal
                segueAfter
                song {
                  id
                  name
                }
              }
            }
          }
          pageInfo {
            endCursor
            hasNextPage
          }
        }
      }
      pageInfo {
        endCursor
        hasNextPage
      }
    }
  }
}
