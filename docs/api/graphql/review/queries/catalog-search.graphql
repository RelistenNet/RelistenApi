query CatalogSearchForWeb($q: String!, $artist: ID) {
  search(q: $q, artistId: $artist) {
    songs(first: 20) {
      nodes {
        kind
        song {
          id
          slug
          name
          matchedShowCount
        }
        importedSong {
          id
          name
        }
      }
      pageInfo {
        endCursor
        hasNextPage
      }
    }
    venues(first: 20) {
      nodes {
        kind
        artistVenue {
          id
          artistShowCount
          venue {
            id
            name
            city
            region
          }
        }
        importedVenue {
          id
          name
          location
        }
      }
      pageInfo {
        endCursor
        hasNextPage
      }
    }
    shows(first: 20) {
      nodes {
        id
        displayDate
        sourceCount
        artist {
          id
          name
        }
      }
      pageInfo {
        endCursor
        hasNextPage
      }
    }
  }
}
