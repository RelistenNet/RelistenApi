query RecordingPlayback($source: ID!) {
  source(id: $source) {
    id
    displayDate
    isSoundboard
    taper
    source
    lineage
    show {
      id
      displayDate
      artist {
        id
        name
      }
      importedVenue {
        name
        location
      }
    }
    sets {
      id
      index
      isEncore
      tracks {
        id
        title
        duration
        trackPosition
        mp3Url
        flacUrl
        normalization {
          state
          parts {
            ordinal
            segueAfter
            song {
              id
              name
            }
          }
        }
      }
    }
  }
}
