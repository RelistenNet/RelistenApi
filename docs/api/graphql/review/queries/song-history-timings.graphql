query SongHistoryTimings($song: ID!, $first: Int! = 25, $after: String) {
  song(id: $song) {
    id
    name
    matchedShowCount
    shows(first: $first, after: $after, orderBy: DATE_DESCENDING) {
      nodes {
        show {
          id
          displayDate
          sourceCount
        }
        timings {
          singleSong {
            median
            min
            max
            sourceCount
          }
          multiSong {
            median
            min
            max
            sourceCount
          }
        }
      }
      pageInfo {
        endCursor
        hasNextPage
      }
    }
  }
}
