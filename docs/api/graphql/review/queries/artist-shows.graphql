query ArtistShows($artist: ID!, $after: String, $count: Boolean! = false) {
  artist(id: $artist) {
    id
    name
    shows(first: 25, after: $after, orderBy: DATE_DESCENDING) {
      nodes {
        id
        displayDate
        sourceCount
        avgRating
        hasSoundboardSource
      }
      totalCount @include(if: $count)
      pageInfo {
        endCursor
        hasNextPage
      }
    }
  }
}
