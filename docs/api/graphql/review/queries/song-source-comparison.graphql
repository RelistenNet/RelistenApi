query SongSourceComparison($song: ID!, $from: DateTime!, $through: DateTime!) {
  song(id: $song) {
    id
    name
    shows(first: 1, filter: { from: $from, through: $through }) {
      nodes {
        show {
          id
          displayDate
          sourceCount
        }
        tracks(first: 50, selection: ALL) {
          nodes {
            id
            title
            duration
            mp3Url
            flacUrl
            source {
              id
              isSoundboard
              source
              taper
              transferrer
              lineage
              avgRating
              avgRatingWeighted
            }
          }
          pageInfo {
            endCursor
            hasNextPage
          }
        }
      }
    }
  }
}
