query PlaylistHydration($ids: [ID!]!) {
  sourceTracksByIds(ids: $ids) {
    id
    title
    duration
    mp3Url
    flacUrl
    show {
      id
      displayDate
      artist {
        id
        name
      }
      artistVenue {
        venue {
          id
          name
          city
          region
        }
      }
    }
    source {
      id
      isSoundboard
      avgRating
      source
      taper
    }
    normalization {
      state
      parts {
        ordinal
        segueAfter
        song {
          id
          name
        }
      }
    }
  }
}
