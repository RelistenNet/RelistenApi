query ArtistNavigation($artist: ID!) {
  artist(id: $artist) {
    id
    name
    slug
    showCount
    sourceCount
    features
    years(first: 100) {
      nodes {
        id
        year
        showCount
        sourceCount
      }
    }
    songs(first: 25) {
      nodes {
        kind
        song {
          id
          slug
          name
          matchedShowCount
          matchedTrackCount
        }
        importedSong {
          id
          name
          setlistShowCount
        }
      }
      pageInfo {
        endCursor
        hasNextPage
      }
    }
    venues(first: 25) {
      nodes {
        kind
        artistVenue {
          id
          artistShowCount
          venue {
            id
            slug
            name
            city
            region
          }
        }
        importedVenue {
          id
          name
          location
          showCount
        }
      }
      pageInfo {
        endCursor
        hasNextPage
      }
    }
  }
}
