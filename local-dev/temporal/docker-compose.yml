name: relisten-temporal-dev
services:
  postgres:
    image: postgres:17.10
    environment:
      POSTGRES_USER: relisten
      POSTGRES_PASSWORD: local_ingestion
      POSTGRES_DB: relisten_ingestion
    ports: ["127.0.0.1:15433:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relisten -d relisten_ingestion"]
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: redis:7.4
    ports: ["127.0.0.1:16380:6379"]
  temporal:
    image: temporalio/auto-setup:1.29.1
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: relisten
      POSTGRES_PWD: local_ingestion
      POSTGRES_SEEDS: postgres
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      SKIP_DEFAULT_NAMESPACE_CREATION: "false"
    ports: ["127.0.0.1:17233:7233"]
  ui:
    image: temporalio/ui:2.34.0
    depends_on: [temporal]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports: ["127.0.0.1:18233:8080"]
volumes:
  postgres-data:
